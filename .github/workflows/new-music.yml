name: Add NCS Music

on:
  issues:
    types: [labeled]

concurrency:
  group: music-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  add-music:
    # Only run when the triggering label completes the Music + New Content pair
    if: |
      (github.event.label.name == 'Music' || github.event.label.name == 'New Content') &&
      contains(github.event.issue.labels.*.name, 'Music') &&
      contains(github.event.issue.labels.*.name, 'New Content') &&
      !contains(github.event.issue.labels.*.name, 'Content Review Ready')
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for "Content Review Ready" label
        id: label_check
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const hasLabel = issue.data.labels.some(l => l.name === 'Content Review Ready');
            if (hasLabel) {
              core.warning('Issue already has "Content Review Ready" label — skipping.');
              core.setOutput('already_done', 'true');
            } else {
              core.setOutput('already_done', 'false');
            }

      - name: Set up Node.js
        if: steps.label_check.outputs.already_done == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.label_check.outputs.already_done == 'false'
        working-directory: WorkflowScripts
        run: npm i

      - name: Extract NCS links from issue body
        if: steps.label_check.outputs.already_done == 'false'
        id: extract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          LINKS=$(echo "$ISSUE_BODY" | grep -oP 'https?://ncs\.io/[^\s\)\"]+' | sort -u)

          if [ -z "$LINKS" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "links<<EOF" >> $GITHUB_OUTPUT
            echo "$LINKS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Comment if no NCS links found
        if: steps.label_check.outputs.already_done == 'false' && steps.extract.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⚠️ No NCS Links Found\n\nThis issue is tagged **Music** and **New Content**, but no \`ncs.io\` links were found in the issue body.\n\nPlease add a link in the format: \`https://ncs.io/TrackName\``
            });

      - name: Process each NCS link
        if: steps.label_check.outputs.already_done == 'false' && steps.extract.outputs.found == 'true'
        id: process
        working-directory: WorkflowScripts
        env:
          LINKS: ${{ steps.extract.outputs.links }}
        run: |
          RESULTS="[]"

          while IFS= read -r LINK; do
            [ -z "$LINK" ] && continue
            echo "Processing: $LINK"

            OUTPUT=$(node AddMusic.js "$LINK" 2>&1)
            EXIT_CODE=$?

            ENTRY=$(jq -n \
              --arg link "$LINK" \
              --arg output "$OUTPUT" \
              --argjson ok "$( [ $EXIT_CODE -eq 0 ] && echo true || echo false )" \
              '{link: $link, output: $output, ok: $ok}')

            RESULTS=$(echo "$RESULTS" | jq --argjson e "$ENTRY" '. + [$e]')
          done <<< "$LINKS"

          echo "$RESULTS"

          echo "$RESULTS" > /tmp/music_results.json

      - name: Post summary comment
        if: steps.label_check.outputs.already_done == 'false' && steps.extract.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('/tmp/music_results.json', 'utf8'));

            let body = `## 🎵 Music Addition Summary\n\n`;
            body += `Processed **${results.length}** track(s) from this issue.\n\n---\n\n`;

            for (const result of results) {
              if (!result.ok) {
                body += `### ❌ Failed: \`${result.link}\`\n`;
                body += `\`\`\`\n${result.output}\n\`\`\`\n\n`;
                continue;
              }

              let track;
              try {
                track = JSON.parse(result.output);
              } catch {
                body += `### ⚠️ Unexpected output for \`${result.link}\`\n`;
                body += `\`\`\`\n${result.output}\n\`\`\`\n\n`;
                continue;
              }

              const artists = track.artists?.map(a => a.name).join(', ') ?? 'Unknown';
              const tags    = track.tags?.map(t => `\`${t.name}\``).join(' ') ?? 'None';
              const date    = track.date ? new Date(track.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : 'Unknown';

              body += `### ✅ ${track.name}\n`;
              if (track.coverUrl) {
                body += `<img src="${track.coverUrl}" alt="Cover art" width="120" align="right"/>\n\n`;
              }
              body += `| Field | Value |\n|---|---|\n`;
              body += `| 🎤 Artists | ${artists} |\n`;
              body += `| 🎸 Genre | ${track.genre ?? 'Unknown'} |\n`;
              body += `| 📅 Released | ${date} |\n`;
              body += `| 🏷️ Mood Tags | ${tags} |\n`;
              body += `| 🔗 NCS Link | [${track.name}](https://ncs.io${track.url}) |\n`;
              body += `| ⬇️ Download | [Regular](${track.download?.regular}) |\n`;
              body += `| 🎧 Preview | [Listen](${track.previewUrl}) |\n`;
              body += `\n`;
            }

            body += `---\n*Triggered by issue #${context.issue.number} · [View run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Add "Content Review Ready" label
        if: steps.label_check.outputs.already_done == 'false' && steps.extract.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['Content Review Ready']
            });
      - name: Move issue to "Reviewing Request" in project
        if: steps.label_check.outputs.already_done == 'false' && steps.extract.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUE_ID=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                issue(number: $number) { id }
              }
            }' \
            -f owner="${{ github.repository_owner }}" \
            -f repo="${{ github.event.repository.name }}" \
            -F number=${{ github.event.issue.number }} \
            --jq '.data.repository.issue.id')

          ITEM_ID=$(gh api graphql -f query='
            mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                item { id }
              }
            }' \
            -f project="PVT_kwHOB7Hf-M4Bbwbh" \
            -f content="$ISSUE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId: $item
                fieldId: $field
                value: { singleSelectOptionId: $option }
              }) { projectV2Item { id } }
            }' \
            -f project="PVT_kwHOB7Hf-M4Bbwbh" \
            -f item="$ITEM_ID" \
            -f field="PVTSSF_lAHOB7Hf-M4BbwbhzhWepNs" \
            -f option="a4d6d5b9"