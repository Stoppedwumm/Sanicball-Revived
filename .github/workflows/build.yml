name: Build and Commit Assemblies

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore Subprojects/Sanicball.NonUnity.sln

      - name: Build solution
        run: dotnet build Subprojects/Sanicball.NonUnity.sln -c Release --no-restore

      - name: Copy assemblies to Assets/Assemblies
        shell: pwsh
        run: |
          $outDirs = @(
            'Subprojects/Core/bin/Release/net8.0',
            'Subprojects/Server/bin/Release/net8.0'
          )
          if (!(Test-Path 'Assets/Assemblies')) {
            New-Item -ItemType Directory -Path 'Assets/Assemblies' | Out-Null
          }
          foreach ($d in $outDirs) {
            if (Test-Path $d) {
              Get-ChildItem -Path $d -Filter *.dll -File -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item -Path $_.FullName -Destination 'Assets/Assemblies' -Force
              }
            }
          }

      - name: Commit changes (if any)
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Assets/Assemblies/*.dll || true
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit"
          } else {
            git commit -m "Update assemblies [skip ci]"
            git push
          }