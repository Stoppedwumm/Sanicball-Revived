name: Build Server and Upload

on:
  release:
    types: [published, created]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Restore NuGet packages
        run: nuget restore Subprojects/Sanicball.NonUnity.sln

      - name: Build solution
        run: msbuild Subprojects/Sanicball.NonUnity.sln /p:Configuration=Release

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path "Subprojects/Server/bin/Release/*" -DestinationPath "server.zip"

      # ✅ Always upload as artifact (useful for manual runs)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: server.zip

      # ✅ Upload to GitHub Release ONLY when triggered by release
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: server.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
